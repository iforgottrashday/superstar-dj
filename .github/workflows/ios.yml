name: iOS Build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "android/**"

env:
  GODOT_VERSION: "4.6.2-stable"
  BUNDLE_ID: "com.iforgottrashday.apex"
  EXPORT_PRESET: "iOS"

jobs:
  build-ios:
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Godot 4.6.2
        run: |
          set -e
          curl -L -o godot.zip "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_macos.universal.zip"
          unzip -q godot.zip
          mv Godot.app /Applications/
          /Applications/Godot.app/Contents/MacOS/Godot --version

      - name: Install iOS export templates
        run: |
          set -e
          curl -L -o templates.tpz "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_export_templates.tpz"
          # .tpz is just a renamed .zip. Unpack to where Godot looks.
          TEMPLATE_DIR="$HOME/Library/Application Support/Godot/export_templates/${GODOT_VERSION/-/.}"
          mkdir -p "$TEMPLATE_DIR"
          unzip -q templates.tpz -d /tmp/godot_templates
          mv /tmp/godot_templates/templates/* "$TEMPLATE_DIR/"
          ls "$TEMPLATE_DIR" | head -20

      - name: Decode signing certificate and provisioning profile
        env:
          IOS_CERT_BASE64: ${{ secrets.IOS_CERT_BASE64 }}
          IOS_CERT_PASSWORD: ${{ secrets.IOS_CERT_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -e
          echo "$IOS_CERT_BASE64" | base64 --decode > /tmp/cert.p12
          echo "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode > /tmp/profile.mobileprovision

          # Build keychain
          KEYCHAIN_PASSWORD="ci_$(openssl rand -hex 8)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain

          # Import cert
          security import /tmp/cert.p12 -k build.keychain -P "$IOS_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain

          # Extract provisioning profile UUID + install in the right spot
          PROFILE_PLIST=$(security cms -D -i /tmp/profile.mobileprovision)
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c "Print :UUID" /dev/stdin <<< "$PROFILE_PLIST")
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp /tmp/profile.mobileprovision "$HOME/Library/MobileDevice/Provisioning Profiles/${PROFILE_UUID}.mobileprovision"
          echo "PROFILE_UUID=$PROFILE_UUID" >> $GITHUB_ENV
          echo "Installed profile: $PROFILE_UUID"

      - name: Generate export_presets.cfg
        env:
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          set -e
          cat > export_presets.cfg << 'PRESET'
          [preset.0]
          name="iOS"
          platform="iOS"
          runnable=true
          dedicated_server=false
          custom_features=""
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          export_path=""
          encryption_include_filters=""
          encryption_exclude_filters=""
          encrypt_pck=false
          encrypt_directory=false
          script_export_mode=2

          [preset.0.options]
          custom_template/debug=""
          custom_template/release=""
          application/icon_interpolation=4
          application/export_project_only=false
          application/delete_old_export_files_unconditionally=false
          application/code_sign_identity_debug="Apple Development"
          application/export_method_debug=1
          application/code_sign_identity_release="Apple Development"
          application/export_method_release=1
          application/targeted_device_family=2
          application/bundle_identifier="__BUNDLE_ID__"
          application/signature=""
          application/app_store_team_id="__TEAM_ID__"
          application/provisioning_profile_uuid_debug="__PROFILE_UUID__"
          application/provisioning_profile_specifier_debug=""
          application/provisioning_profile_uuid_release="__PROFILE_UUID__"
          application/provisioning_profile_specifier_release=""
          application/additional_plist_content=""
          application/icon_background_color=Color(0, 0, 0, 1)
          application/export_angle=0
          application/min_ios_version="12.0"
          application/short_version="1.0.0"
          application/version="1"
          application/bitcode=false
          application/launch_screens_interpolation=4
          capabilities/access_wifi=false
          capabilities/push_notifications=false
          user_data/accessible_from_files_app=false
          user_data/accessible_from_itunes_sharing=false
          storyboard/use_launch_screen_storyboard=false
          storyboard/image_scale_mode=0
          storyboard/custom_image@2x=""
          storyboard/custom_image@3x=""
          storyboard/use_custom_bg_color=false
          storyboard/custom_bg_color=Color(0, 0, 0, 1)
          PRESET

          # Substitute the secret values in place.
          sed -i '' "s|__BUNDLE_ID__|${BUNDLE_ID}|g" export_presets.cfg
          sed -i '' "s|__TEAM_ID__|${IOS_TEAM_ID}|g" export_presets.cfg
          sed -i '' "s|__PROFILE_UUID__|${PROFILE_UUID}|g" export_presets.cfg

      - name: Import Godot project (build cache)
        run: |
          set -e
          # Headless --import primes the .godot/ folder so the export doesn't
          # do it inline (which is slower + more error-prone in CI).
          /Applications/Godot.app/Contents/MacOS/Godot --headless --import || true

      - name: Export IPA
        run: |
          set -e
          mkdir -p build/ios
          /Applications/Godot.app/Contents/MacOS/Godot --headless --export-release "${EXPORT_PRESET}" "$(pwd)/build/ios/apex.ipa"
          ls -la build/ios

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: apex-ios-${{ github.sha }}
          path: build/ios/apex.ipa
          retention-days: 30
